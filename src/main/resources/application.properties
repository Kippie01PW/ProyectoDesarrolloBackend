spring.application.name=ms_security
server.port=8181
spring.datasource.url=jdbc:mysql://localhost:3306/proyecto_db
spring.datasource.username=root
spring.datasource.password=******

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

security.jwt.secret=${JWT_SECRET:clave-local-educativa-de-32-bytes}
security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
security.two-factor.ttl-minutes=${TWO_FACTOR_TTL_MINUTES:5}
security.two-factor.max-attempts=${TWO_FACTOR_MAX_ATTEMPTS:5}
security.two-factor.pepper=${TWO_FACTOR_PEPPER:}
security.password-reset.ttl-minutes=${PASSWORD_RESET_TTL_MINUTES:15}
security.password-reset.frontend-url=${FRONTEND_RESET_PASSWORD_URL:http://localhost:5173/reset-password}

email-service.url=${EMAIL_SERVICE_URL:http://localhost:5000}
email-service.api-key=${EMAIL_SERVICE_API_KEY:}

firebase.project-id=${FIREBASE_PROJECT_ID:authentication-mngacademic}
firebase.jwk-set-uri=${FIREBASE_JWK_SET_URI:https://www.googleapis.com/service_accounts/v1/jwk/securetoken@system.gserviceaccount.com}
firebase.unverified-email-providers=${FIREBASE_UNVERIFIED_EMAIL_PROVIDERS:github.com,github}
